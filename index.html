const banzhiURLs={},banzhiLoading={};window.banzhiChunks={};

async function loadBanzhiAsset(name){if(banzhiURLs[name])return banzhiURLs[name];if(banzhiLoading[name])return banzhiLoading[name];const a=banzhiManifest[name];if(a.data)return banzhiAsset(name);return banzhiLoading[name]=(async()=>{await Promise.all(a.files.map(file=>new Promise((resolve,reject)=>{const s=document.createElement('script');s.src=file;s.onload=resolve;s.onerror=()=>reject(new Error('文件加载失败'));document.head.append(s)})));const encoded=window.banzhiChunks[name].join('');const bytes=Uint8Array.from(atob(encoded),c=>c.charCodeAt(0));delete window.banzhiChunks[name];return banzhiURLs[name]=URL.createObjectURL(new Blob([bytes],{type:a.mime}))})()}
const banzhiWired=new WeakSet();
function hydrateBanzhi(){document.querySelectorAll('[data-banzhi-asset]').forEach(el=>{if(banzhiWired.has(el))return;banzhiWired.add(el);const name=el.getAttribute('data-banzhi-asset');if(el.tagName==='A'){el.addEventListener('click',async e=>{e.preventDefault();const download=el.getAttribute('download');const win=download===null?window.open('about:blank','_blank'):null;if(win)win.document.title='正在准备资料 · 半知';try{toast('正在准备文件，稍等一下。');const url=await loadBanzhiAsset(name);if(download!==null){const a=document.createElement('a');a.href=url;a.download=download||name;document.body.append(a);a.click();a.remove()}else if(win){win.location.href=url}else{const a=document.createElement('a');a.href=url;a.target='_blank';a.rel='noopener';document.body.append(a);a.click();a.remove()}}catch{win?.close();toast('文件暂未加载，请稍后再试。')}})}else{const video=el.tagName==='SOURCE'?el.parentElement:null;const hint=document.createElement('p');if(video){hint.className='small-note';hint.textContent='正在准备视频…';video.after(hint)}loadBanzhiAsset(name).then(url=>{el.src=url;if(video){video.load();hint.remove()}}).catch(()=>{if(video)hint.textContent='视频暂未加载，请刷新后重试。'})}})}

const raw=[
['作品集从 0 到 1：准备顺序与自查表','作品集','英国 / 美国','PORTFOLIO','作品集\n从零开始','先建立一份可以执行的作品集准备路线，再开始制作。','01 / 先确认目标\n建立目标院校与课程表，逐项记录学位、入学季、官方申请入口、作品集要求和截止日期。不同课程要求不同，不要把往年经验当成当年的规则。\n\n02 / 把项目过程留下来\n为每个项目保留问题定义、观察记录、参考文献、草图、试验、失败版本和修改理由。整理时要能回答：为什么做、如何研究、为什么这样选择，以及最后学到了什么。\n\n03 / 先做一个完整项目\n先用一个小项目走完调研、发展、制作、表达的全过程，再评估时间和方法。项目数量、页数与文件格式以目标课程要求为准。\n\n04 / 交付前自查\n逐项检查文字可读性、图片质量、项目角色说明、引用来源、链接权限与文件大小。把文件交给不了解项目的人阅读，检查对方能否理解你的问题和贡献。'],
['艺术留学选校：建立自己的比较表','选校申请','全球','SCHOOL RESEARCH','选校\n比较手册','从兴趣、课程和成本出发，留下选择依据。','01 / 先写需求\n用一页纸说明希望学习什么、目前基础、申请时间与预算边界。区分必须满足的条件和可以协商的条件，例如授课语言、学制、地区和课程方向。\n\n02 / 看课程本身\n从课程官网记录教学单元、工作室、教师、设施、毕业项目和考核方式。学校排名只能提供部分信息，不能替代对具体课程的研究。\n\n03 / 把成本列全\n比较表应包含学费、生活费估算、材料制作、保险、旅行与申请相关开支。写明币种、估算日期与来源，并给不确定费用留出余量。\n\n04 / 留下证据\n每个判断旁保留官方链接、查询日期和未解决问题。可用字段：课程名称｜研究方向｜入学要求｜作品集｜截止时间｜费用｜信息来源｜个人适配理由。'],
['设计调研入门：从问题到证据','专业学习','全球','DESIGN METHODS','设计调研\n方法笔记','把直觉变成可讨论、可验证的设计问题。','01 / 缩小问题\n用“谁在什么场景遇到了什么困难”描述问题，避免一开始就预设产品形态。先确认问题是否真实存在，再决定是否需要做一个应用或物件。\n\n02 / 组合研究方法\n桌面研究用于了解背景，访谈用于理解经验，观察用于发现具体行为。记录方法、时间、样本来源与局限，避免把少数受访者代表所有人。\n\n03 / 让证据能追溯\n区分原始记录、你的解释和设计决定。访谈获得同意后再记录，公开材料匿名化；图片、文章和数据标明出处。\n\n04 / 用小实验验证\n把关键假设写出来，用低成本原型测试。预先定义要观察的行为，记录反例和失败原因，并说明下一轮如何修改。'],
['英国艺术硕士申请：资料整理工作表','选校申请','英国','APPLICATION','英国硕士\n申请整理','一套可复用的申请材料整理方法，不含未经核实的截止日期。','01 / 建立总表\n每个课程单独一行，记录申请入口、截止日期、作品集、语言要求、推荐信、文书、面试和费用信息。所有要求回到目标课程官网确认。\n\n02 / 文件按版本管理\n采用“课程_材料_日期_版本”命名。把原件、翻译件、提交版分开保存，建立提交清单，避免修改后的文件覆盖已经提交的版本。\n\n03 / 文书与作品集对照\n围绕真实经历、研究兴趣和课程匹配展开，具体说明自己做过什么以及希望继续探索什么。不要编造经历或把通用文书批量提交。\n\n04 / 提交后继续跟踪\n记录提交日期、申请编号、补件要求和面试安排。时间线用于管理自己的任务，录取要求与处理时间仍由院校决定。'],
['如何读懂一场艺术院校毕业展','展览刊物','全球','GRADUATE SHOW','毕业展\n阅读指南','从“看起来好看”走向理解项目与专业。','01 / 按课程看展\n先找到官方毕业展页面，确认年份、院系与课程。保留作品链接和作者署名，避免把不同层级的课程成果混为一谈。\n\n02 / 读项目问题\n记录作品回应的议题、采用的方法、媒介与成果。尝试用自己的话写一段摘要，区分作者表述与自己的理解。\n\n03 / 观察过程\n关注调研、实验与迭代，而非只收集成品图片。问自己：项目的证据是什么？方法和结论是否对应？还有什么未被解决？\n\n04 / 转化为自己的行动\n选一个感兴趣的方法做小型练习。参考应帮助自己提出新问题，使用他人图像、观点与作品时保留出处，避免复制项目。'],
['交互设计作品集：项目表达框架','作品集','全球','INTERACTION','交互设计\n项目表达','把问题、研究、原型与验证讲成一条清楚的线。','01 / 说明具体场景\n交代目标使用者、使用环境、限制条件和现有做法。明确个人角色、团队分工与项目时长。\n\n02 / 展示关键选择\n呈现研究如何影响设计决定。用户旅程、流程图和信息架构应服务于理解问题，避免只展示工具产物。\n\n03 / 让交互可理解\n展示关键任务、主要状态、错误处理与原型演示。静态界面之外，应说明使用者如何完成任务以及反馈如何发生。\n\n04 / 诚实呈现验证\n写清测试对象、任务、观察结果与限制。没有上线的数据就不写商业增长结果，可以用实际观察说明哪里需要改进。'],
['服装设计：研究册与过程记录','专业学习','全球','FASHION','服装设计\n研究与过程','围绕概念、材料、版型和身体建立自己的过程档案。','01 / 从具体观察开始\n记录研究对象的出处与语境，整理视觉之外的文字、历史、行为和材料信息。让概念能够通过研究发展。\n\n02 / 材料实验单独归档\n保留面料、处理方法、实验条件、样片照片和结果。照片配尺度与说明，记录失败实验能帮助之后复现和比较。\n\n03 / 让二维与三维互相反馈\n保存草图、立裁、纸样、试穿与调整记录。说明每次变化如何回应身体、结构或表达需求。\n\n04 / 编辑过程册\n按研究与发展逻辑组织材料，标注引用、制作方式和个人贡献。过程册是工作记录，不应事后虚构为一条没有失败的直线。'],
['建筑与空间：案例分析记录模板','专业学习','全球','ARCHITECTURE','建筑与空间\n案例分析','从场地、使用和构造读懂一个案例。','01 / 核对基本信息\n记录项目名称、设计团队、地点、完成时间和资料来源。区分实际建成项目与概念方案。\n\n02 / 理解场地关系\n结合地图、平剖面、照片与项目说明，观察入口、流线、尺度、光照、环境和使用者。缺少实地信息时明确分析局限。\n\n03 / 分析空间与构造\n以自己的分析图解释空间组织、材料及结构逻辑，标明原图出处。没有证据的技术判断应作为待验证问题。\n\n04 / 提炼可迁移的方法\n总结案例处理问题的策略，而非复制形式。工作表字段：问题｜证据｜空间回应｜使用体验｜局限｜可借鉴的方法。'],
['艺术刊物阅读：建立灵感索引','展览刊物','全球','READING NOTES','艺术刊物\n阅读与索引','让阅读留下可查找的线索，而不只是一个文件夹。','01 / 建立书目信息\n记录刊名、期号、时间、出版方、作者与合法获取入口。只存封面很难再次找到内容，文章标题和关键词更有用。\n\n02 / 先浏览再精读\n先看目录、编辑说明与重点专题，再选择与当前研究问题相关的文章。为每篇文章写一两句摘要。\n\n03 / 区分摘录与观点\n摘录注明页码与来源，自己的判断单独记录。图片和版式参考也应保留署名和上下文。\n\n04 / 每月整理一次\n删除重复条目，按主题建立索引，为最有帮助的内容写使用场景。获取刊物优先使用出版社、图书馆或授权渠道。'],
['申请时间线：从目标日期倒排','选校申请','全球','PLANNING','申请时间线\n倒排工具','用阶段和里程碑管理准备，而不是套用统一月份。','01 / 从官方日期倒排\n确认目标项目当期截止时间与时区。向前安排材料核对、作品集编辑、语言准备和必要证明的办理时间。\n\n02 / 设置可检查的里程碑\n把“完成作品集”拆成研究、实验、成果、拍摄、编辑和校对，每个阶段写明产出和负责人。\n\n03 / 为外部依赖留时间\n推荐人、翻译、成绩单和预约等环节需要提前沟通。每周检查阻塞任务，并准备备用安排。\n\n04 / 每周复盘\n记录本周完成、下周任务、需要帮助与风险。计划发生变化时更新总表，不用一次偏差否定整个准备过程。'],
['联系导师与访谈：提问准备清单','社群共学','全球','CONVERSATIONS','提问与访谈\n准备清单','带着具体问题沟通，让交流有准备也有边界。','01 / 先做基础研究\n阅读对方公开介绍与相关项目，说明自己的背景和提问目的。可从具体课程、研究方向或项目方法切入。\n\n02 / 问可回答的问题\n把“我适合吗”拆成对基础能力、课程方法、学习安排的具体问题。不要要求对方代替自己作重大决定。\n\n03 / 尊重时间与隐私\n提前说明预计时长，录音、引用与公开发布都应获得同意。拒绝或不回复是正常结果，避免反复打扰。\n\n04 / 整理交流结果\n把已确认信息、个人经验和待查问题分开。交流建议不能取代官方入学要求，引用经验时注明时间与适用背景。'],
['数字资料整理：命名、标签与备份','社群共学','全球','PERSONAL LIBRARY','建立你的\n学习资料库','用一个轻量系统管理长期积累的资料。','01 / 命名先保持一致\n采用“主题_作者或机构_年份_标题”的简单结构。保留原始文件名在索引中，避免为了整齐丢失来源信息。\n\n02 / 标签控制数量\n建议先设专业、用途、学习阶段和阅读状态四组标签。一个文件可以进入多个专题，索引记录比复制多个文件更容易维护。\n\n03 / 给资料写使用说明\n每条写清是什么、适合谁、什么时候用、来源和获取方式。链接失效时保留书目信息，并定期检查关键入口。\n\n04 / 定期备份与清理\n重要资料保留独立备份，检查能否恢复。清除重复文件，更新索引；共享文件前检查个人信息、授权和访问权限。']
];

const banzhiNotes=[[17, "拾遗｜先把任务说清楚，再让 AI 开始", "AI学习", "TASK FIRST", "先说清楚\\n再开始", "用目标、材料、约束与检查方式，写出一份能执行的任务说明。", "01 / 写下要完成的事\n把“帮我做一下”换成具体成果：一页摘要、一份比较表，或一封邮件。写明给谁看、用在什么地方。\n\n02 / 提供必要材料\n把你掌握的原文、数据与背景一起交给工具。区分已知事实和待确认信息，不让缺失背景变成看似确定的结论。\n\n03 / 约定边界\n说明长度、语气、格式与必须保留的信息；涉及个人或工作资料时，先确认是否适合放入所用工具。\n\n04 / 留出检查\n给出能验收的标准。核对数字、人名、引文与原始来源，记录仍不确定的地方。"], [18, "试笔｜第一次试用 AI 工具的记录表", "AI学习", "TRY AND CHECK", "试过了\\n再判断", "围绕一个小任务，留下输入、过程、结果与适用边界。", "01 / 先选一个小任务\n选择结果容易核对的任务，用不敏感的样例材料开始。写下不使用该工具时自己的处理方法。\n\n02 / 记录输入和过程\n保留任务说明、原材料、工具名称、试用日期以及关键调整。相同问题的不同尝试要分开记录。\n\n03 / 检查结果\n看它是否遗漏事实、编造来源或误解要求。把能采用的部分、需要修改的部分和无法确认的部分分开。\n\n04 / 写下适用边界\n用具体经历回答：适合谁、适合什么任务、需要什么条件。一次试用的结果不能代表所有人或所有场景。"], [19, "存疑｜AI 给了答案，怎样留下核验线索", "AI学习", "KEEP THE QUESTION", "不确定的\\n先留着", "把“听起来对”变成可检查的问题，给没有查实的内容留一个位置。", "01 / 标记待核验的句子\n把答案拆成具体说法：谁、何时、什么数字、什么条件。不要只写“这段可能不对”。\n\n02 / 找回原始依据\n沿着引文回到原始文件、官方说明或完整记录。能打开链接，还需要确认内容是否真的支持这句话。\n\n03 / 分清事实与解释\n记录哪些是来源明说的，哪些是自己的推测，哪些仍缺证据。没查到时，保留“尚未确认”。\n\n04 / 记下下一步\n写清待查来源、需要补充的问题与下次核对日期。更正时保留变化记录，让学习也可以被追溯。"]];

function openResource(id){const d=data.find(x=>x.id===id);showModal(`<div class="eyebrow">${d.en} / ${d.type}</div><h2>${d.title}</h2><div class="small-note">${d.cat} · ${d.country} · 收录于 ${d.date}</div><p>${d.intro}</p><div class="actions"><button id="modal-save" class="outline" onclick="toggleSave(${id})">${saved.includes(id)?'★ 已收藏':'☆ 收藏资料'}</button>${d.source?`<a class="primary" href="${d.source}" target="_blank" rel="noopener noreferrer">前往官方来源 ↗</a>`:`<button class="primary" onclick="downloadGuide(${id})">下载原创指南 ↓</button>`}</div><div class="reader-body">${d.body.split('\n\n').map(p=>{const [h,...body]=p.split('\n');return `<h3>${esc(h)}</h3><p>${esc(body.join('\n')).replaceAll('\n','<br>')}</p>`}).join('')}</div>${d.source?`<h3>来源</h3><a class="source-link" target="_blank" rel="noopener noreferrer" href="${d.source}">${d.source}</a>`:`<div class="notice">半知 原创整理 · 学习方法参考。涉及申请的具体要求请核对院校当期信息；工具能力以实际验证为准。下载为 Markdown 文本，可用文本编辑器阅读。</div>`}<h3>继续探索</h3>${sets.filter(s=>s.ids.includes(id)).map(s=>`<button class="list-row" onclick="openSet(${sets.indexOf(s)})"><span>${s.title}<small>所属专题 · ${s.ids.length} 份资料</small></span><span>→</span></button>`).join('')}`)}
function downloadGuide(id){const a=document.createElement('a');a.href=banzhiAsset('guide-'+id+'.md');a.download='半知_学习笔记_'+id+'.md';document.body.appendChild(a);a.click();a.remove();toast('已开始下载原创指南')}
function openSet(i){const s=sets[i];showModal(`<div class="eyebrow">CURATED COLLECTION / ${s.no}</div><h2>${s.title}</h2><p>${s.desc}</p><div class="notice">阅读建议：按照下方顺序浏览。先看方法指南，再到官方入口核对具体信息；可按自己的进度跳读。</div>${s.ids.map((id,n)=>{const d=data.find(x=>x.id===id);return `<button class="list-row" onclick="openResource(${id})"><span><span style="color:var(--orange);margin-right:10px">${String(n+1).padStart(2,'0')}</span>${d.title}<small>${d.type} · ${d.cat}</small></span><span>↗</span></button>`}).join('')}<div class="actions"><button class="primary" onclick="followSet(${i})">${interests.includes(s.title)?'✓ 已关注此专题':'关注此专题'}</button></div><p class="small-note">关注仅保存在当前浏览器，尚不发送通知。</p>`)}
function followSet(i){const t=sets[i].title;interests=interests.includes(t)?interests.filter(x=>x!==t):[...interests,t];write('interests',interests);openSet(i);toast(interests.includes(t)?'已在本机记录专题关注':'已取消关注')}
function interest(){showModal(`<div class="eyebrow">YOUR INTERESTS</div><h2>你希望深入哪些方向？</h2><p>选择后保存在当前浏览器，便于下次回来继续探索。</p><form onsubmit="saveInterests(event)">${['AI工具实践','AI概念与方法','直播共学','作品集准备','院校与申请','设计研究方法','艺术刊物与展览','社群交流'].map(t=>`<label style="display:block;padding:10px 0"><input type="checkbox" name="interest" value="${t}" ${interests.includes(t)?'checked':''}> ${t}</label>`).join('')}<button class="primary" style="margin-top:18px">保存我的关注</button></form><div class="notice">本操作不注册账号、不提交报名，也不会触发扣费。</div>`)}
function saveInterests(e){e.preventDefault();const choices=[...new FormData(e.target).getAll('interest')];interests=[...interests.filter(x=>sets.some(s=>s.title===x)),...choices];write('interests',interests);closeModal();toast('已保存你的关注方向')}
function publishPost(e){e.preventDefault();const text=$('#post-text').value.trim(),name=$('#post-name').value.trim()||'学习中的朋友';if(!text){toast('先写一点内容吧');return}posts.unshift({id:Date.now(),name,text,date:new Date().toLocaleDateString('zh-CN'),comments:[]});if(write('posts',posts)){$('#post-text').value='';renderPosts();toast('已保存到本机广场')}}
function renderPosts(){$('#posts').innerHTML=`<article class="post"><div class="post-head"><span class="avatar">半</span><b>半知编辑部</b><span>置顶 · 使用指引</span></div><p>欢迎来到共学广场。提问时可以写清专业、学习阶段、已经尝试过的方法，以及需要哪种资料。当前为本机交流体验，正式共享社区将在后续接入账号与云端数据。</p><button onclick="openResource(11)">阅读提问准备清单 →</button></article>`+posts.map(p=>`<article class="post"><div class="post-head"><span class="avatar">${esc(p.name.slice(0,1))}</span><b>${esc(p.name)}</b><span>${esc(p.date)}</span></div><p>${esc(p.text)}</p>${p.comments.map(c=>`<div class="comment">${esc(c)}</div>`).join('')}<button onclick="commentForm(${p.id})">评论 (${p.comments.length})</button><button style="float:right;color:var(--muted)" onclick="deletePost(${p.id})">删除本机帖子</button></article>`).join('')}
function commentForm(id){showModal(`<h2>继续这段交流</h2><form onsubmit="addComment(event,${id})"><label for="comment">写下你的评论</label><textarea class="field" id="comment" maxlength="1000" required placeholder="分享经验或补充一个资料线索"></textarea><button class="primary">保存本机评论</button></form>`)}
function addComment(e,id){e.preventDefault();let t=$('#comment').value.trim();if(!t)return;let p=posts.find(p=>p.id===id);if(!p)return;p.comments.push(t);write('posts',posts);closeModal();renderPosts();toast('评论已保存到本机')}
function deletePost(id){posts=posts.filter(p=>p.id!==id);write('posts',posts);renderPosts();toast('已删除本机帖子')}
function about(){brandAbout()}
function rights(){showModal(`<h2>来源与使用说明</h2><h3>原创指南</h3><p>本站首期 12 份指南由半知 编辑整理，提供网页阅读与 Markdown 下载。内容用于学习方法参考，不承诺申请结果。</p><h3>官方资料入口</h3><p>4 条官方导航仅提供来源链接，不镜像院校文件。课程、学费、截止日期与录取要求以官方当期信息为准。</p><h3>刊物与第三方内容</h3><p>当前未上传第三方付费刊物或未获授权的报告全文。后续收录将标明来源与获取方式。</p><h3>当前版本的数据</h3><p>收藏、关注、发布与评论仅保存在当前浏览器。没有云端账户、跨设备同步、支付或正式社群开通。可在浏览器网站数据设置中清除这些记录。</p>`)}
let toastTimer;function toast(t){clearTimeout(toastTimer);$('#toast').innerHTML=`<div class="toast">${esc(t)}</div>`;toastTimer=setTimeout(()=>$('#toast').innerHTML='',2500)}
view=location.hash.slice(1)||'home';if(![...navs.map(n=>n[0]),'member','other'].includes(view))view='home';render();

window.banzhiOriginal={render,openResource};
</script><script>let formatFilter='all',shelfMode=read('shelf-mode','grid'),readerSize=read('reader-size',16);
const baseRender=window.banzhiOriginal.render,baseResource=window.banzhiOriginal.openResource;
const svgIcon=(path)=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">${path}</svg>`;
const liveIcon='<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m10 9 5 3-5 3z"/>';
function nav(){const order=['home','library','collections','live','updates','community','saved'];$('#mainnav').innerHTML=order.map(id=>{const i=navs.findIndex(n=>n[0]===id),n=navs[i];return `<button class="nav ${view===id?'active':''}" ${view===id?'aria-current="page"':''} onclick="navigate('${id}')">${svgIcon(icons[i]||liveIcon)}${n[1]}${id==='library'?`<span class="count">${data.length}</span>`:id==='saved'?`<span class="count">${saved.length}</span>`:''}</button>`}).join('');$('#saved-count').textContent=saved.length;const bottom=$('#mobile-bottom');if(bottom)bottom.innerHTML=[['home','发现',icons[0]],['library','资料',icons[1]],['live','直播',liveIcon],['community','共学',icons[4]],['saved','收藏',icons[5]]].map(n=>`<a href="#${n[0]}" ${view===n[0]?'aria-current="page"':''}>${svgIcon(n[2])}<span>${n[1]}</span></a>`).join('')}
function banzhiHome(){const recent=data.find(d=>d.id===read('recent-resource',0));return `<section class="banzhi-hero"><div><div class="eyebrow hero-kicker">BANZHI / 学习，留一半给自己</div><h1>学然后，<br>知<em>不足。</em></h1><p>一个慢一点、准一点的 AI 学习集。<br>和 Curio 一起，捡回值得留下的知识，<br>把另一半，留给自己的思考。</p><div class="hero-actions"><button class="primary orange" onclick="navigate('library')">翻开学习集 <span aria-hidden="true">↗</span></button><button class="outline" onclick="navigate('live')">去直播间坐坐 →</button></div></div><div class="curio-scene"><div class="curio-orbit" aria-hidden="true"></div><button class="curio-trigger" onclick="startGuide()" aria-label="让 Curio 帮我找一个学习起点"><img src="${banzhiAsset('curio.png')}" width="489" height="558" alt="拾遗小怪 Curio"></button><span class="curio-line">“咦，这个能收吗？”</span><span class="curio-caption">CURIO / 拾遗小怪</span><button class="curio-help" onclick="startGuide()">不知道读什么？问问 Curio →</button></div></section><div class="edition-line"><span>拾一点新知，留一点思考。</span><span>不装懂，不催促。</span></div>${recent?`<div class="continue-reading"><div><span>上次打开</span><button onclick="openResource(${recent.id})">${esc(recent.title)}</button></div><button class="text-link" onclick="openResource(${recent.id})">继续读 →</button></div>`:''}<div class="column-grid">${banzhiColumns.map((c,i)=>`<button class="column-item" onclick="openColumn('${c[0]}')"><span class="column-no">0${i+1}</span><b>${c[0]}</b><span>${c[1]}</span></button>`).join('')}</div><div class="home-search">${searchbox()}<div class="search-hints"><span>从一个问题开始</span><button onclick="hot('AI')">AI 入门</button><button onclick="hot('调研')">研究方法</button><button onclick="hot('作品集')">作品集</button></div></div><section class="live-teaser"><div><span class="live-tag">直播间 · 栏目筹备中</span><h2>看世界，看工具，看自己。</h2><p>从一个问题出发，走到一次真实实践。</p></div><button class="primary" onclick="navigate('live')">节目与资料 ↗</button></section>${section('今天，先拾这几页','CURIO’S PICKS','从一个真实任务开始，慢慢积累自己的方法。',`<button class="text-link" onclick="navigate('library')">全部 ${data.length} 份 ↗</button>`)}<div class="grid">${[17,18,19,3].map(id=>card(data.find(x=>x.id===id))).join('')}</div>${section('成集 · 围绕一个问题','COLLECTIONS','有顺序、有来源，也有可以动手的下一步。',`<button class="text-link" onclick="navigate('collections')">全部合集 ↗</button>`)}${collections()}<div class="newsletter"><div><div class="eyebrow" style="margin-bottom:8px">LEARN WITH CURIOSITY</div><h3>Curio 负责捡，你负责懂。</h3><p>留下一条笔记、一个问题，或者这周的一次小尝试。</p></div><button class="primary" onclick="navigate('community')">走进共学广场 ↗</button></div>`}
function startGuide(){showModal(`<div class="eyebrow">CURIO / 找一个起点</div><h2>今天，想往前走哪一小步？</h2><p>不用一下学完。先选一个和自己有关的问题。</p><button class="list-row" onclick="openResource(17)"><span>我想把 AI 用到一个任务里<small>先把目标、材料和检查方式说清楚</small></span><span>→</span></button><button class="list-row" onclick="openResource(18)"><span>我想试一个新工具<small>留下输入、过程、结果与适用边界</small></span><span>→</span></button><button class="list-row" onclick="openResource(19)"><span>我不确定这个答案对不对<small>把存疑的地方变成可核验的问题</small></span><span>→</span></button><button class="list-row" onclick="closeModal();navigate('collections')"><span>我想找一组资料慢慢读<small>按主题浏览 AI 学习与艺术设计合集</small></span><span>→</span></button>`)}
function searchbox(){return `<form class="search" role="search" onsubmit="searchSubmit(event)"><span aria-hidden="true">⌕</span><label class="visually-hidden" for="search">搜索资料</label><input id="search" type="search" autocomplete="off" value="${esc(query)}" placeholder="搜一个问题、主题或关键词" oninput="searchTyping(this.value)"><button type="button" class="search-clear" aria-label="清除搜索" onclick="clearSearch()" ${query?'':'hidden'}>×</button><button type="submit">找资料</button></form>`}
function searchTyping(v){if(view!=='library'&&view!=='saved')return;query=v;const c=$('.search-clear');if(c)c.hidden=!v;renderResults()}
function clearSearch(){query='';const input=$('#search');if(input){input.value='';input.focus()}const c=$('.search-clear');if(c)c.hidden=true;if($('#results'))renderResults()}
function controls(){return `<div class="controls"><div class="pills" aria-label="按主题筛选">${['全部','AI学习','作品集','选校申请','专业学习','展览刊物','社群共学'].map(c=>`<button class="pill ${category===c?'selected':''}" aria-pressed="${category===c}" onclick="setCategory('${c}')">${c}</button>`).join('')}</div></div><div class="filter-bottom"><span id="result-count" class="result-note" role="status"></span><div class="filter-tools"><label><span class="visually-hidden">资料类型</span><select aria-label="资料类型" onchange="formatFilter=this.value;renderResults()"><option value="all" ${formatFilter==='all'?'selected':''}>全部类型</option><option value="original" ${formatFilter==='original'?'selected':''}>原创整理</option><option value="official" ${formatFilter==='official'?'selected':''}>官方入口</option></select></label><label><span class="visually-hidden">资料排序</span><select aria-label="资料排序" onchange="sort=this.value;renderResults()"><option value="recommended" ${sort==='recommended'?'selected':''}>编辑推荐</option><option value="newest" ${sort==='newest'?'selected':''}>最新收录</option><option value="title" ${sort==='title'?'selected':''}>标题排序</option></select></label><div class="view-switch" aria-label="资料展示方式"><button aria-pressed="${shelfMode==='grid'}" onclick="setShelfMode('grid')" aria-label="书架视图">▦</button><button aria-pressed="${shelfMode==='list'}" onclick="setShelfMode('list')" aria-label="列表视图">☷</button></div></div></div>`}
function setShelfMode(mode){shelfMode=mode;write('shelf-mode',mode);renderResults();document.querySelectorAll('.view-switch button').forEach((b,i)=>b.setAttribute('aria-pressed',String((i===0)===(mode==='grid'))))}
function readingTime(d){return Math.max(1,Math.ceil(d.body.length/400))}
function card(d){return `<article class="resource"><button class="cover" style="background:${d.color[0]};color:${d.color[1]}" onclick="openResource(${d.id})" aria-label="阅读${esc(d.title)}"><div class="tag">${d.en} / ${String(d.id).padStart(2,'0')}</div><div class="cover-title">${esc(d.cover).replaceAll('\n','<br>')}</div><div class="decor" aria-hidden="true"></div><div class="bottom">BANZHI · ${d.source?'SOURCE DIRECTORY':'LEARNING NOTES'}</div></button><h3><button style="padding:0;text-align:left" onclick="openResource(${d.id})">${esc(d.title)}</button></h3><div class="resource-meta">${esc(d.cat)} · ${d.source?'官方入口':esc(d.type)}</div><p class="resource-desc">${esc(d.intro)}</p><div class="resource-actions"><span>${d.source?'前往官网 ↗':`约 ${readingTime(d)} 分钟 · 可下载`}</span><button class="save ${saved.includes(d.id)?'on':''}" onclick="toggleSave(${d.id})" aria-pressed="${saved.includes(d.id)}" aria-label="${saved.includes(d.id)?'取消收藏':'收藏'}${esc(d.title)}">${saved.includes(d.id)?'★':'☆'}</button></div></article>`}
function filtered(){let rows=data.filter(d=>(view!=='saved'||saved.includes(d.id))&&(category==='全部'||d.cat===category)&&(formatFilter==='all'||(formatFilter==='official'?!!d.source:!d.source))&&(!query||`${d.title} ${d.cat} ${d.country} ${d.intro} ${d.en} ${d.body}`.toLowerCase().includes(query.toLowerCase())));if(sort==='newest')rows.sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);else if(sort==='title')rows.sort((a,b)=>a.title.localeCompare(b.title,'zh-CN'));else rows.sort((a,b)=>(b.id>=17)-(a.id>=17));return rows}
function renderResults(){const box=$('#results');if(!box)return;const rows=filtered();box.classList.toggle('list-view',shelfMode==='list');const hasFilter=query||category!=='全部'||formatFilter!=='all';box.innerHTML=rows.length?rows.map(card).join(''):`<div class="empty"><img src="${banzhiAsset('curio.png')}" alt="Curio 正在找资料"><strong>${view==='saved'&&!hasFilter?'你的书架，等着第一份收藏。':'这次还没拾到匹配的资料。'}</strong><p>${view==='saved'&&!hasFilter?'看到想留住的内容，点一下 ☆，下次从这里继续。':'试试更短的关键词，或放宽主题与资料类型。'}</p><button class="outline" onclick="resetFilters()">${view==='saved'&&!hasFilter?'去资料库看看 →':'清除全部筛选 →'}</button></div>`;const count=$('#result-count');if(count)count.innerHTML=`${view==='saved'?'收藏中找到':'找到'} ${rows.length} 份资料${hasFilter?` <button class="filters-clear" onclick="resetFilters()">清除筛选 ×</button>`:''}`}
function resetFilters(){if(view==='saved'&&!saved.length){navigate('library');return}category='全部';query='';formatFilter='all';render()}
function render(){baseRender();const extras=document.querySelectorAll('#result-count');extras.forEach((e,i)=>{if(i>0)e.remove()});if($('#results'))renderResults();document.title=({home:'半知｜AI学习集',library:'资料库',collections:'专题合集',live:'直播间',updates:'每周精选',community:'共学广场',saved:'我的收藏',member:'共学会员',other:'服务与合作'}[view]||'半知')+(view==='home'?'':' · 半知');const pageHead=$('.page-head');if(pageHead&&['library','saved'].includes(view))pageHead.style.marginBottom='18px';const main=$('#main');main.setAttribute('tabindex','-1');if(view==='live')wireVideoBehavior();}
function navigate(v){closeNavigation();closeModal();formatFilter='all';if(view===v){render();window.scrollTo({top:0,behavior:window.matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth'});return}location.hash=v}
function toggleNavigation(){const side=$('.sidebar');const open=!side.classList.contains('open');side.classList.toggle('open',open);$('#drawer-backdrop').classList.toggle('open',open);$('.mobile-toggle').setAttribute('aria-expanded',String(open));document.body.classList.toggle('drawer-open',open);if(open)side.querySelector('button')?.focus()}
function closeNavigation(){const side=$('.sidebar');if(side)side.classList.remove('open');$('#drawer-backdrop')?.classList.remove('open');$('.mobile-toggle')?.setAttribute('aria-expanded','false');document.body.classList.remove('drawer-open')}
let modalOrigin=null;
function showModal(content){if(!$('.modal'))modalOrigin=document.activeElement;$('#overlay').innerHTML=`<div class="modal-wrap" onclick="if(event.target===this)closeModal()"><section class="modal" role="dialog" aria-modal="true" aria-label="资料与专题详情" tabindex="-1"><button class="close" onclick="closeModal()" aria-label="关闭">×</button>${content}</section></div>`;document.body.style.overflow='hidden';document.querySelector('header').inert=true;document.querySelector('.layout').inert=true;$('#mobile-bottom').inert=true;$('.modal').focus()}
function closeModal(){const wasOpen=!!$('.modal');document.querySelectorAll('video').forEach(v=>v.pause());$('#overlay').innerHTML='';document.body.style.overflow='';document.querySelector('header').inert=false;document.querySelector('.layout').inert=false;$('#mobile-bottom').inert=false;if(wasOpen&&modalOrigin?.isConnected)modalOrigin.focus();modalOrigin=null}
function openResource(id){const d=data.find(x=>x.id===Number(id));if(!d){toast('这份资料还没有收录。');return}write('recent-resource',d.id);baseResource(d.id);const modal=$('.modal');modal.style.setProperty('--reader-size',readerSize+'px');const body=modal.querySelector('.reader-body');const toolbar=document.createElement('div');toolbar.className='reader-tools';toolbar.innerHTML=`<span>${d.source?'官方资料导航':`约 ${readingTime(d)} 分钟阅读`} · ${d.date}</span><div class="tools"><button onclick="changeReaderSize(-1)" aria-label="缩小阅读字号">A−</button><button onclick="changeReaderSize(1)" aria-label="放大阅读字号">A＋</button><button onclick="copyResourceLink(${d.id})">复制链接</button></div>`;body.before(toolbar);const track=document.createElement('div');track.className='reader-progress';track.setAttribute('aria-hidden','true');track.innerHTML='<span></span>';body.before(track);modal.addEventListener('scroll',()=>{const total=modal.scrollHeight-modal.clientHeight;track.firstChild.style.width=(total?Math.min(100,modal.scrollTop/total*100):100)+'%'});const save=$('#modal-save');if(save)save.setAttribute('aria-pressed',String(saved.includes(d.id)))}
function changeReaderSize(delta){readerSize=Math.min(21,Math.max(14,readerSize+delta));write('reader-size',readerSize);$('.modal')?.style.setProperty('--reader-size',readerSize+'px')}
async function copyResourceLink(id){const url=location.origin+location.pathname+'#read-'+id;try{await navigator.clipboard.writeText(url);toast('资料链接已复制。')}catch{toast('浏览器暂不允许复制，可使用下方链接。');const p=document.createElement('p');p.className='source-link';p.textContent=url;$('.reader-tools').after(p)}}
function openDeepLink(){const match=location.hash.match(/^#read-(\d+)$/);if(!match)return;view='library';category='全部';query='';formatFilter='all';render();openResource(Number(match[1]));}
function wireVideoBehavior(){document.querySelectorAll('video').forEach(v=>{v.addEventListener('play',()=>document.querySelectorAll('video').forEach(other=>{if(other!==v)other.pause()}));v.addEventListener('error',()=>{const p=document.createElement('p');p.textContent='视频暂未加载，试试下方的单独打开链接。';p.className='notice';v.after(p)},{once:true})})}
const mobile=document.createElement('nav');mobile.id='mobile-bottom';mobile.className='mobile-bottom';mobile.setAttribute('aria-label','手机快捷导航');document.body.append(mobile);
const backdrop=document.createElement('div');backdrop.id='drawer-backdrop';backdrop.className='drawer-backdrop';backdrop.addEventListener('click',closeNavigation);document.body.append(backdrop);
const topButton=document.createElement('button');topButton.className='backtop';topButton.setAttribute('aria-label','返回顶部');topButton.textContent='↑';topButton.addEventListener('click',()=>window.scrollTo({top:0,behavior:window.matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth'}));document.body.append(topButton);
$('.mobile-toggle').setAttribute('onclick','toggleNavigation()');$('.mobile-toggle').setAttribute('aria-expanded','false');$('.mobile-toggle').setAttribute('aria-controls','site-navigation');$('.sidebar').id='site-navigation';$('#mainnav').setAttribute('role','navigation');$('#mainnav').setAttribute('aria-label','主要导航');
window.addEventListener('scroll',()=>topButton.classList.toggle('visible',window.scrollY>650),{passive:true});window.addEventListener('hashchange',()=>{closeNavigation();closeModal();formatFilter='all';category='全部';query='';if(/^#read-\d+$/.test(location.hash)){openDeepLink()}else{const route=location.hash.slice(1)||'home';view=[...navs.map(n=>n[0]),'member','other'].includes(route)?route:'home';render()}window.scrollTo(0,0);if(!$('.modal'))$('#main').focus({preventScroll:true})});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeNavigation()});
render();openDeepLink();

function toggleSave(id){const next=saved.includes(id)?saved.filter(x=>x!==id):[...saved,id];if(!write('saved',next))return;saved=next;nav();document.querySelectorAll('button[onclick="toggleSave('+id+')"]').forEach(b=>{const on=saved.includes(id);b.classList.toggle('on',on);b.setAttribute('aria-pressed',String(on));b.setAttribute('aria-label',(on?'取消收藏':'收藏')+data.find(d=>d.id===id).title);if(b.id==='modal-save')b.textContent=on?'★ 已收藏':'☆ 收藏资料';else b.textContent=on?'★':'☆'});if(view==='saved')renderResults();toast(saved.includes(id)?'收好了，已放进你的书架。':'已移出收藏。')}

document.querySelector('.skip-link').addEventListener('click',e=>{e.preventDefault();$('#main').focus();$('#main').scrollIntoView({behavior:window.matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth'})});

document.addEventListener('keydown',e=>{if(e.key!=='Tab'||!document.querySelector('.sidebar.open')||document.querySelector('.modal'))return;const els=[document.querySelector('.mobile-toggle'),...document.querySelectorAll('.sidebar button,.sidebar a')].filter(x=>x.getClientRects().length);const first=els[0],last=els.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus()}});
</script></body></html>
