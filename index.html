['作品集从 0 到 1：准备顺序与自查表','作品集','英国 / 美国','PORTFOLIO','作品集\n从零开始','先建立一份可以执行的作品集准备路线，再开始制作。','01 / 先确认目标\n建立目标院校与课程表，逐项记录学位、入学季、官方申请入口、作品集要求和截止日期。不同课程要求不同，不要把往年经验当成当年的规则。\n\n02 / 把项目过程留下来\n为每个项目保留问题定义、观察记录、参考文献、草图、试验、失败版本和修改理由。整理时要能回答：为什么做、如何研究、为什么这样选择，以及最后学到了什么。\n\n03 / 先做一个完整项目\n先用一个小项目走完调研、发展、制作、表达的全过程，再评估时间和方法。项目数量、页数与文件格式以目标课程要求为准。\n\n04 / 交付前自查\n逐项检查文字可读性、图片质量、项目角色说明、引用来源、链接权限与文件大小。把文件交给不了解项目的人阅读，检查对方能否理解你的问题和贡献。'],
['艺术留学选校：建立自己的比较表','选校申请','全球','SCHOOL RESEARCH','选校\n比较手册','从兴趣、课程和成本出发，留下选择依据。','01 / 先写需求\n用一页纸说明希望学习什么、目前基础、申请时间与预算边界。区分必须满足的条件和可以协商的条件，例如授课语言、学制、地区和课程方向。\n\n02 / 看课程本身\n从课程官网记录教学单元、工作室、教师、设施、毕业项目和考核方式。学校排名只能提供部分信息，不能替代对具体课程的研究。\n\n03 / 把成本列全\n比较表应包含学费、生活费估算、材料制作、保险、旅行与申请相关开支。写明币种、估算日期与来源，并给不确定费用留出余量。\n\n04 / 留下证据\n每个判断旁保留官方链接、查询日期和未解决问题。可用字段：课程名称｜研究方向｜入学要求｜作品集｜截止时间｜费用｜信息来源｜个人适配理由。'],
['设计调研入门：从问题到证据','专业学习','全球','DESIGN METHODS','设计调研\n方法笔记','把直觉变成可讨论、可验证的设计问题。','01 / 缩小问题\n用“谁在什么场景遇到了什么困难”描述问题，避免一开始就预设产品形态。先确认问题是否真实存在，再决定是否需要做一个应用或物件。\n\n02 / 组合研究方法\n桌面研究用于了解背景，访谈用于理解经验，观察用于发现具体行为。记录方法、时间、样本来源与局限，避免把少数受访者代表所有人。\n\n03 / 让证据能追溯\n区分原始记录、你的解释和设计决定。访谈获得同意后再记录，公开材料匿名化；图片、文章和数据标明出处。\n\n04 / 用小实验验证\n把关键假设写出来，用低成本原型测试。预先定义要观察的行为，记录反例和失败原因，并说明下一轮如何修改。'],
['英国艺术硕士申请：资料整理工作表','选校申请','英国','APPLICATION','英国硕士\n申请整理','一套可复用的申请材料整理方法，不含未经核实的截止日期。','01 / 建立总表\n每个课程单独一行，记录申请入口、截止日期、作品集、语言要求、推荐信、文书、面试和费用信息。所有要求回到目标课程官网确认。\n\n02 / 文件按版本管理\n采用“课程_材料_日期_版本”命名。把原件、翻译件、提交版分开保存，建立提交清单，避免修改后的文件覆盖已经提交的版本。\n\n03 / 文书与作品集对照\n围绕真实经历、研究兴趣和课程匹配展开，具体说明自己做过什么以及希望继续探索什么。不要编造经历或把通用文书批量提交。\n\n04 / 提交后继续跟踪\n记录提交日期、申请编号、补件要求和面试安排。时间线用于管理自己的任务，录取要求与处理时间仍由院校决定。'],
['如何读懂一场艺术院校毕业展','展览刊物','全球','GRADUATE SHOW','毕业展\n阅读指南','从“看起来好看”走向理解项目与专业。','01 / 按课程看展\n先找到官方毕业展页面，确认年份、院系与课程。保留作品链接和作者署名，避免把不同层级的课程成果混为一谈。\n\n02 / 读项目问题\n记录作品回应的议题、采用的方法、媒介与成果。尝试用自己的话写一段摘要，区分作者表述与自己的理解。\n\n03 / 观察过程\n关注调研、实验与迭代，而非只收集成品图片。问自己：项目的证据是什么？方法和结论是否对应？还有什么未被解决？\n\n04 / 转化为自己的行动\n选一个感兴趣的方法做小型练习。参考应帮助自己提出新问题，使用他人图像、观点与作品时保留出处，避免复制项目。'],
['交互设计作品集：项目表达框架','作品集','全球','INTERACTION','交互设计\n项目表达','把问题、研究、原型与验证讲成一条清楚的线。','01 / 说明具体场景\n交代目标使用者、使用环境、限制条件和现有做法。明确个人角色、团队分工与项目时长。\n\n02 / 展示关键选择\n呈现研究如何影响设计决定。用户旅程、流程图和信息架构应服务于理解问题，避免只展示工具产物。\n\n03 / 让交互可理解\n展示关键任务、主要状态、错误处理与原型演示。静态界面之外，应说明使用者如何完成任务以及反馈如何发生。\n\n04 / 诚实呈现验证\n写清测试对象、任务、观察结果与限制。没有上线的数据就不写商业增长结果，可以用实际观察说明哪里需要改进。'],
['服装设计：研究册与过程记录','专业学习','全球','FASHION','服装设计\n研究与过程','围绕概念、材料、版型和身体建立自己的过程档案。','01 / 从具体观察开始\n记录研究对象的出处与语境，整理视觉之外的文字、历史、行为和材料信息。让概念能够通过研究发展。\n\n02 / 材料实验单独归档\n保留面料、处理方法、实验条件、样片照片和结果。照片配尺度与说明，记录失败实验能帮助之后复现和比较。\n\n03 / 让二维与三维互相反馈\n保存草图、立裁、纸样、试穿与调整记录。说明每次变化如何回应身体、结构或表达需求。\n\n04 / 编辑过程册\n按研究与发展逻辑组织材料，标注引用、制作方式和个人贡献。过程册是工作记录，不应事后虚构为一条没有失败的直线。'],
['建筑与空间：案例分析记录模板','专业学习','全球','ARCHITECTURE','建筑与空间\n案例分析','从场地、使用和构造读懂一个案例。','01 / 核对基本信息\n记录项目名称、设计团队、地点、完成时间和资料来源。区分实际建成项目与概念方案。\n\n02 / 理解场地关系\n结合地图、平剖面、照片与项目说明，观察入口、流线、尺度、光照、环境和使用者。缺少实地信息时明确分析局限。\n\n03 / 分析空间与构造\n以自己的分析图解释空间组织、材料及结构逻辑，标明原图出处。没有证据的技术判断应作为待验证问题。\n\n04 / 提炼可迁移的方法\n总结案例处理问题的策略，而非复制形式。工作表字段：问题｜证据｜空间回应｜使用体验｜局限｜可借鉴的方法。'],
['艺术刊物阅读：建立灵感索引','展览刊物','全球','READING NOTES','艺术刊物\n阅读与索引','让阅读留下可查找的线索，而不只是一个文件夹。','01 / 建立书目信息\n记录刊名、期号、时间、出版方、作者与合法获取入口。只存封面很难再次找到内容，文章标题和关键词更有用。\n\n02 / 先浏览再精读\n先看目录、编辑说明与重点专题，再选择与当前研究问题相关的文章。为每篇文章写一两句摘要。\n\n03 / 区分摘录与观点\n摘录注明页码与来源，自己的判断单独记录。图片和版式参考也应保留署名和上下文。\n\n04 / 每月整理一次\n删除重复条目，按主题建立索引，为最有帮助的内容写使用场景。获取刊物优先使用出版社、图书馆或授权渠道。'],
['申请时间线：从目标日期倒排','选校申请','全球','PLANNING','申请时间线\n倒排工具','用阶段和里程碑管理准备，而不是套用统一月份。','01 / 从官方日期倒排\n确认目标项目当期截止时间与时区。向前安排材料核对、作品集编辑、语言准备和必要证明的办理时间。\n\n02 / 设置可检查的里程碑\n把“完成作品集”拆成研究、实验、成果、拍摄、编辑和校对，每个阶段写明产出和负责人。\n\n03 / 为外部依赖留时间\n推荐人、翻译、成绩单和预约等环节需要提前沟通。每周检查阻塞任务，并准备备用安排。\n\n04 / 每周复盘\n记录本周完成、下周任务、需要帮助与风险。计划发生变化时更新总表，不用一次偏差否定整个准备过程。'],
['联系导师与访谈：提问准备清单','社群共学','全球','CONVERSATIONS','提问与访谈\n准备清单','带着具体问题沟通，让交流有准备也有边界。','01 / 先做基础研究\n阅读对方公开介绍与相关项目，说明自己的背景和提问目的。可从具体课程、研究方向或项目方法切入。\n\n02 / 问可回答的问题\n把“我适合吗”拆成对基础能力、课程方法、学习安排的具体问题。不要要求对方代替自己作重大决定。\n\n03 / 尊重时间与隐私\n提前说明预计时长，录音、引用与公开发布都应获得同意。拒绝或不回复是正常结果，避免反复打扰。\n\n04 / 整理交流结果\n把已确认信息、个人经验和待查问题分开。交流建议不能取代官方入学要求，引用经验时注明时间与适用背景。'],
['数字资料整理：命名、标签与备份','社群共学','全球','PERSONAL LIBRARY','建立你的\n学习资料库','用一个轻量系统管理长期积累的资料。','01 / 命名先保持一致\n采用“主题_作者或机构_年份_标题”的简单结构。保留原始文件名在索引中，避免为了整齐丢失来源信息。\n\n02 / 标签控制数量\n建议先设专业、用途、学习阶段和阅读状态四组标签。一个文件可以进入多个专题，索引记录比复制多个文件更容易维护。\n\n03 / 给资料写使用说明\n每条写清是什么、适合谁、什么时候用、来源和获取方式。链接失效时保留书目信息，并定期检查关键入口。\n\n04 / 定期备份与清理\n重要资料保留独立备份，检查能否恢复。清除重复文件，更新索引；共享文件前检查个人信息、授权和访问权限。']
];

const navs=[['home','发现资料'],['library','资料库'],['collections','专题合集'],['updates','每周精选'],['community','共学广场'],['saved','我的收藏']];
function nav(){ $('#mainnav').innerHTML=navs.map((n,i)=>`<button class="nav ${view===n[0]?'active':''}" onclick="navigate('${n[0]}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">${icons[i]}</svg>${n[1]}${i===1?`<span class="count">${data.length}</span>`:i===5?`<span class="count">${saved.length}</span>`:''}</button>`).join('');$('#saved-count').textContent=saved.length;}
function navigate(v){location.hash=v;if(view===v)render();$('.sidebar').classList.remove('open')}
window.addEventListener('hashchange',()=>{view=location.hash.slice(1)||'home';if(![...navs.map(n=>n[0]),'member','other'].includes(view))view='home';category='全部';query='';render();window.scrollTo(0,0)});
function footer(){return `<footer><span>© 2026 留皇叔 3.0 · 资料有序，学习有伴。</span><span><button onclick="about()">关于我们</button> · <button onclick="rights()">来源与使用说明</button> · <button onclick="navigate('other')">其他服务</button></span></footer>`}
function section(title,en,sub,action=''){return `<div class="section-top"><div><h2>${title}<small>${en}</small></h2>${sub?`<p>${sub}</p>`:''}</div>${action}</div>`}
function collections(){return `<div class="collections">${sets.map((s,i)=>`<button class="collection" onclick="openSet(${i})"><div class="number">COLLECTION / ${s.no}</div><h3>${s.title}</h3><span class="meta">${s.ids.length} 份资料 · ${s.sub} ↗</span><div class="shape"></div></button>`).join('')}</div>`}
function searchbox(){return `<form class="search" onsubmit="searchSubmit(event)"><span aria-hidden="true">⌕</span><label class="visually-hidden" for="search">搜索资料</label><input id="search" type="search" value="${esc(query)}" placeholder="搜索院校、专业、作品集或学习主题"><button type="submit">找资料</button></form>`}
function controls(){return `<div class="controls"><div class="pills">${['全部','作品集','选校申请','专业学习','展览刊物','社群共学'].map(c=>`<button class="pill ${category===c?'selected':''}" onclick="setCategory('${c}')">${c}</button>`).join('')}</div><label><span class="visually-hidden">排序</span><select onchange="sort=this.value;renderResults()"><option value="recommended" ${sort==='recommended'?'selected':''}>编辑推荐</option><option value="newest" ${sort==='newest'?'selected':''}>最新收录</option><option value="title" ${sort==='title'?'selected':''}>标题排序</option></select></label></div>`}
function card(d){return `<article class="resource"><button class="cover" style="background:${d.color[0]};color:${d.color[1]}" onclick="openResource(${d.id})" aria-label="阅读${esc(d.title)}"><div class="tag">${d.en} / ${String(d.id).padStart(2,'0')}</div><div class="cover-title">${esc(d.cover).replace('\n','<br>')}</div><div class="decor"></div><div class="bottom">LIU HUANG SHU · ${d.type==='官方导航'?'SOURCE DIRECTORY':'LEARNING NOTES'}</div></button><h3><button style="padding:0;text-align:left" onclick="openResource(${d.id})">${d.title}</button></h3><div class="resource-meta">${d.cat} · ${d.country} · ${d.type}</div><div class="resource-actions"><span>${d.type==='官方导航'?'官网直达 ↗':'免费阅读 · 可下载'}</span><button class="save ${saved.includes(d.id)?'on':''}" onclick="toggleSave(${d.id})" aria-label="${saved.includes(d.id)?'取消收藏':'收藏'}${esc(d.title)}">${saved.includes(d.id)?'★':'☆'}</button></div></article>`}
function filtered(){let rows=data.filter(d=>(view!=='saved'||saved.includes(d.id))&&(category==='全部'||d.cat===category)&&(!query||`${d.title} ${d.cat} ${d.country} ${d.intro} ${d.en}`.toLowerCase().includes(query.toLowerCase())));if(sort==='newest')rows.reverse();if(sort==='title')rows.sort((a,b)=>a.title.localeCompare(b.title,'zh-CN'));return view==='home'&&category==='全部'&&!query?rows.slice(0,8):rows}
function renderResults(){let rows=filtered();$('#results').innerHTML=rows.length?rows.map(card).join(''):`<div class="empty">${view==='saved'?'还没有收藏。点击资料卡上的 ☆，建立你的学习书架。':'暂未找到匹配资料。试试“作品集”“英国”或“调研”。'}<br><button class="text-link" onclick="resetFilters()">${view==='saved'?'去资料库浏览 →':'清除筛选 →'}</button></div>`;if($('#result-count'))$('#result-count').textContent=rows.length+' 份';}
function resetFilters(){if(view==='saved'){navigate('library');return}category='全部';query='';render()}
function setCategory(c){category=c;if(view==='home'){view='library';history.replaceState(null,'','#library')}render()}
function searchSubmit(e){e.preventDefault();query=$('#search').value.trim();if(view==='home'){view='library';history.replaceState(null,'','#library')}render()}

if(view==='community'){html=head('学习路上，留个位置给彼此。','LEARN TOGETHER','提一个具体问题，分享一条有用线索，或者记录这周的学习进展。')+`<div class="notice">共学广场 · 本机体验：发布与评论只保存在当前浏览器，尚不与其他成员共享。请勿填写敏感个人信息。</div><form class="panel" onsubmit="publishPost(event)"><h3>今天，你想交流什么？</h3><label class="visually-hidden" for="post-name">昵称</label><input id="post-name" class="field" placeholder="你的昵称（可不填）" maxlength="24"><label class="visually-hidden" for="post-text">交流内容</label><textarea id="post-text" class="field" placeholder="例如：准备交互设计作品集，想找有关用户访谈的入门资料……" maxlength="2000" required></textarea><button class="primary" type="submit">发布到本机广场</button></form><div class="posts" id="posts"></div>`}
if(view==='other'){html=head('其他服务与合作','OTHER SERVICES','资料社群之外，我们继续连接教育机构、老师和学习者。')+`<div class="member-layout"><div class="panel"><h2>机构与老师连接</h2><p>围绕具体专业和学习目标，探索合适的机构与老师。现阶段未开通站内咨询或转介受理。</p><h2 style="margin-top:30px">机构运营与内容服务</h2><p>历史积累包括机构内容整理、人物采访与空间展示，合作范围根据实际项目商议。</p><h2 style="margin-top:30px">VR 探校与空间拍摄</h2><p>用真实环境记录，帮助大家了解学习空间。可前往原站查看历史内容。</p><a class="primary" style="display:inline-block;margin-top:10px" href="http://www.6huangshu.com/" target="_blank" rel="noopener noreferrer">访问留皇叔原站 ↗</a></div><div class="panel"><div class="eyebrow">OUR FOCUS</div><h2 style="margin-top:15px">核心始终是资料社群。</h2><p>让资料更容易被找到，让学习更容易开始。其他服务保留在这里，按实际需求连接。</p><button class="outline" onclick="navigate('home')">回到资料首页 →</button></div></div>`}
$('#main').innerHTML=html+footer();if($('#results'))renderResults();if(view==='community')renderPosts();}
function toggleSave(id){saved=saved.includes(id)?saved.filter(x=>x!==id):[...saved,id];write('saved',saved);nav();if($('#results'))renderResults();if($('#modal-save')){$('#modal-save').textContent=saved.includes(id)?'★ 已收藏':'☆ 收藏资料'}toast(saved.includes(id)?'已加入你的学习书架':'已取消收藏')}
function showModal(content){modalReturn=document.activeElement;$('#overlay').innerHTML=`<div class="modal-wrap" onclick="if(event.target===this)closeModal()"><section class="modal" role="dialog" aria-modal="true" aria-label="资料与专题详情" tabindex="-1"><button class="close" onclick="closeModal()" aria-label="关闭">×</button>${content}</section></div>`;document.body.style.overflow='hidden';$('.modal').focus()}
function closeModal(){$('#overlay').innerHTML='';document.body.style.overflow='';modalReturn?.focus?.()}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if(e.key==='Tab'&&$('.modal')){const els=[...$('.modal').querySelectorAll('button,a,input,textarea,select')].filter(x=>!x.disabled);const first=els[0],last=els.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus()}}});
function openResource(id){const d=data.find(x=>x.id===id);showModal(`<div class="eyebrow">${d.en} / ${d.type}</div><h2>${d.title}</h2><div class="small-note">${d.cat} · ${d.country} · 收录于 ${d.date}</div><p>${d.intro}</p><div class="actions"><button id="modal-save" class="outline" onclick="toggleSave(${id})">${saved.includes(id)?'★ 已收藏':'☆ 收藏资料'}</button>${d.source?`<a class="primary" href="${d.source}" target="_blank" rel="noopener noreferrer">前往官方来源 ↗</a>`:`<button class="primary" onclick="downloadGuide(${id})">下载原创指南 ↓</button>`}</div><div class="reader-body">${d.body.split('\n\n').map(p=>{const [h,...body]=p.split('\n');return `<h3>${esc(h)}</h3><p>${esc(body.join('\n')).replaceAll('\n','<br>')}</p>`}).join('')}</div>${d.source?`<h3>来源</h3><a class="source-link" target="_blank" rel="noopener noreferrer" href="${d.source}">${d.source}</a>`:`<div class="notice">留皇叔 3.0 原创整理 · 学习方法参考。具体申请要求请核对目标院校当期官方信息。下载为 Markdown 文本，可用文本编辑器阅读。</div>`}<h3>继续探索</h3>${sets.filter(s=>s.ids.includes(id)).map(s=>`<button class="list-row" onclick="openSet(${sets.indexOf(s)})"><span>${s.title}<small>所属专题 · ${s.ids.length} 份资料</small></span><span>→</span></button>`).join('')}`)}
function downloadGuide(id){const d=data.find(x=>x.id===id);const blob=new Blob(['# '+d.title+'\n\n留皇叔 3.0 原创整理 | '+d.date+'\n\n'+d.intro+'\n\n'+d.body+'\n\n学习方法参考，具体申请要求以院校官方信息为准。'],{type:'text/markdown;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='留皇叔_原创指南_'+id+'.md';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),3000);toast('已生成原创指南下载')}
function openSet(i){const s=sets[i];showModal(`<div class="eyebrow">CURATED COLLECTION / ${s.no}</div><h2>${s.title}</h2><p>${s.desc}</p><div class="notice">阅读建议：按照下方顺序浏览。先看方法指南，再到官方入口核对具体信息；可按自己的进度跳读。</div>${s.ids.map((id,n)=>{const d=data.find(x=>x.id===id);return `<button class="list-row" onclick="openResource(${id})"><span><span style="color:var(--orange);margin-right:10px">${String(n+1).padStart(2,'0')}</span>${d.title}<small>${d.type} · ${d.cat}</small></span><span>↗</span></button>`}).join('')}<div class="actions"><button class="primary" onclick="followSet(${i})">${interests.includes(s.title)?'✓ 已关注此专题':'关注此专题'}</button></div><p class="small-note">关注仅保存在当前浏览器，尚不发送通知。</p>`)}
function followSet(i){const t=sets[i].title;interests=interests.includes(t)?interests.filter(x=>x!==t):[...interests,t];write('interests',interests);openSet(i);toast(interests.includes(t)?'已在本机记录专题关注':'已取消关注')}
function interest(){showModal(`<div class="eyebrow">YOUR INTERESTS</div><h2>你希望深入哪些方向？</h2><p>选择后保存在当前浏览器，便于下次回来继续探索。</p><form onsubmit="saveInterests(event)">${['作品集准备','院校与申请','设计研究方法','艺术刊物与展览','专业学习','社群交流'].map(t=>`<label style="display:block;padding:10px 0"><input type="checkbox" name="interest" value="${t}" ${interests.includes(t)?'checked':''}> ${t}</label>`).join('')}<button class="primary" style="margin-top:18px">保存我的关注</button></form><div class="notice">本操作不注册账号、不提交报名，也不会触发扣费。</div>`)}
function saveInterests(e){e.preventDefault();const choices=[...new FormData(e.target).getAll('interest')];interests=[...interests.filter(x=>sets.some(s=>s.title===x)),...choices];write('interests',interests);closeModal();toast('已保存你的关注方向')}
function publishPost(e){e.preventDefault();const text=$('#post-text').value.trim(),name=$('#post-name').value.trim()||'学习中的朋友';if(!text){toast('先写一点内容吧');return}posts.unshift({id:Date.now(),name,text,date:new Date().toLocaleDateString('zh-CN'),comments:[]});if(write('posts',posts)){$('#post-text').value='';renderPosts();toast('已保存到本机广场')}}
function renderPosts(){$('#posts').innerHTML=`<article class="post"><div class="post-head"><span class="avatar">叔</span><b>留皇叔编辑部</b><span>置顶 · 使用指引</span></div><p>欢迎来到共学广场。提问时可以写清专业、学习阶段、已经尝试过的方法，以及需要哪种资料。当前为本机交流体验，正式共享社区将在后续接入账号与云端数据。</p><button onclick="openResource(11)">阅读提问准备清单 →</button></article>`+posts.map(p=>`<article class="post"><div class="post-head"><span class="avatar">${esc(p.name.slice(0,1))}</span><b>${esc(p.name)}</b><span>${esc(p.date)}</span></div><p>${esc(p.text)}</p>${p.comments.map(c=>`<div class="comment">${esc(c)}</div>`).join('')}<button onclick="commentForm(${p.id})">评论 (${p.comments.length})</button><button style="float:right;color:var(--muted)" onclick="deletePost(${p.id})">删除本机帖子</button></article>`).join('')}
function commentForm(id){showModal(`<h2>继续这段交流</h2><form onsubmit="addComment(event,${id})"><label for="comment">写下你的评论</label><textarea class="field" id="comment" maxlength="1000" required placeholder="分享经验或补充一个资料线索"></textarea><button class="primary">保存本机评论</button></form>`)}
function addComment(e,id){e.preventDefault();let t=$('#comment').value.trim();if(!t)return;let p=posts.find(p=>p.id===id);if(!p)return;p.comments.push(t);write('posts',posts);closeModal();renderPosts();toast('评论已保存到本机')}
function deletePost(id){posts=posts.filter(p=>p.id!==id);write('posts',posts);renderPosts();toast('已删除本机帖子')}
function about(){showModal(`<div class="eyebrow">ABOUT LIU HUANG SHU</div><h2>留皇叔 3.0</h2><p>从记录留学人物与学习空间，到整理资料与连接同行者，留皇叔继续关心真实的学习经历。</p><p>3.0 以艺术留学资料社群为中心：资料库负责查找，专题负责组织，精选负责引导，共学负责交流。</p><a class="source-link" href="http://www.6huangshu.com/index.php/lhs/" target="_blank" rel="noopener noreferrer">查看留皇叔早期品牌介绍 ↗</a>`)}
function rights(){showModal(`<h2>来源与使用说明</h2><h3>原创指南</h3><p>本站首期 12 份指南由留皇叔 3.0 编辑整理，提供网页阅读与 Markdown 下载。内容用于学习方法参考，不承诺申请结果。</p><h3>官方资料入口</h3><p>4 条官方导航仅提供来源链接，不镜像院校文件。课程、学费、截止日期与录取要求以官方当期信息为准。</p><h3>刊物与第三方内容</h3><p>当前未上传第三方付费刊物或未获授权的报告全文。后续收录将标明来源与获取方式。</p><h3>当前版本的数据</h3><p>收藏、关注、发布与评论仅保存在当前浏览器。没有云端账户、跨设备同步、支付或正式社群开通。可在浏览器网站数据设置中清除这些记录。</p>`)}
let toastTimer;function toast(t){clearTimeout(toastTimer);$('#toast').innerHTML=`<div class="toast">${esc(t)}</div>`;toastTimer=setTimeout(()=>$('#toast').innerHTML='',2500)}
view=location.hash.slice(1)||'home';if(![...navs.map(n=>n[0]),'member','other'].includes(view))view='home';render();
